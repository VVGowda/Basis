# Fly.io config. Deploy with: fly launch --no-deploy, then fly deploy.
app = "basis-loans"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8767"

[http_service]
  internal_port = 8767
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
